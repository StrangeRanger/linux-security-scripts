name: Bug Report
description: Report a problem with an auditing or hardening script.
labels: ["awaiting review", "bug"]

body:
  - type: dropdown
    id: component
    attributes:
      label: Affected Script
      description: Select the script involved.
      options:
        - Lynis Installer
        - Root Locker
        - SSHD Hardening
        - UFW Cloudflare
        - Nginx WAF
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Describe the steps that led to the problem, including the command you ran and any relevant configuration or prompt responses.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Describe what happened instead, including any changes to configuration, system access, or service availability.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Output
      description: Paste relevant output, including the first error and surrounding lines, and the exit status if known. No code fences needed.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Include details relevant to the failure. Find the script version in its `# Version:` header. Note any local script changes and the versions of affected tools or services, such as OpenSSH, UFW, or Nginx.
        For Nginx build failures, include sanitized `nginx -V` output and the Nginx installation source.
      placeholder: |
        Linux distribution and release:
        Bash version (bash --version):
        Script version and/or repository commit:
        Relevant tool or service versions:
        Local script changes:

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Link related issues, describe when this last worked, or explain any workarounds or recovery steps you tried and their results.
