name: Feature request
description: Suggest an improvement to an existing script or a new auditing or hardening script.
labels: ["awaiting review", "enhancement"]

body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Improve an existing script
        - Add a new standalone script
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Script
      description: Select affected script. Choose 'N/A' if you are requesting a new script.
      options:
        - Lynis Installer
        - Root Locker
        - SSHD Hardening
        - UFW Cloudflare
        - Nginx WAF
        - N/A
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Describe the task you need to accomplish, who would benefit, and what the current scripts do not address.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the new script or the change you would like to an existing script. For a new script, explain the auditing or hardening task it should perform.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Target Environment and Requirements
      description: Describe the Linux distributions and releases, tools or services, and versions the change should support, if known. Mention relevant privileges, dependencies, or existing configuration that must be preserved.

  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected Outcome
      description: Describe how you would verify that the change meets your needs, including the desired system or service state after running the script.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe current workarounds, manual steps, or existing tools you considered and why they do not meet this use case.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Link relevant upstream documentation, audit recommendations, or related issues.
